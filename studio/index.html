<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>studio · ellie centeno</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="../style.css?v=98">
  <link rel="stylesheet" href="studio.css?v=5">
</head>
<body class="studio">
  <header class="studio-header">
    <a class="back-link" href="../">← home</a>
    <h1 class="studio-title">studio</h1>
    <p class="studio-sub">private uploader — entries go live on your homepage and archives</p>
    <p class="studio-tools">
      <a href="../rest-energy/arrange.html">rest energy</a>
    </p>
  </header>

  <div class="mode-tabs" role="tablist">
    <button class="mode-tab active" data-mode="making" role="tab">making</button>
    <button class="mode-tab" data-mode="walking" role="tab">walking</button>
    <button class="mode-tab mode-tab-manage" data-mode="manage" role="tab">manage</button>
  </div>

  <form class="entry-form" id="entry-form">
    <div class="edit-banner" id="edit-banner" hidden>
      <span>editing an entry — changes replace the original.</span>
      <button type="button" id="cancel-edit" class="cancel-edit">cancel</button>
    </div>
    <!-- photo upload zone -->
    <label class="upload-zone" for="photo-input">
      <span class="upload-zone-text">
        drop photo(s) here<br>
        <span class="upload-zone-hint">or click to choose · multiple allowed</span>
      </span>
      <input id="photo-input" type="file" accept="image/*" multiple hidden>
    </label>
    <div class="photo-previews" id="photo-previews"></div>

    <!-- date -->
    <div class="form-row">
      <label for="date-input">date <span class="optional" id="date-optional">(optional)</span></label>
      <input id="date-input" type="date" name="date">
    </div>

    <!-- alltrails link, walking only -->
    <div class="form-row mode-only mode-only-walking">
      <label for="link-input">alltrails link <span class="optional">(optional)</span></label>
      <input id="link-input" type="url" name="link" placeholder="https://www.alltrails.com/...">
    </div>

    <!-- state, walking only — drops a pin on the map -->
    <div class="form-row mode-only mode-only-walking">
      <label for="state-input">state
        <span class="hint">drops a pin on this state's map</span>
      </label>
      <select id="state-input" name="state">
        <option value="">— pick a state —</option>
      </select>
    </div>

    <!-- caption -->
    <div class="form-row">
      <label for="caption-input">
        caption
        <span class="hint"><code>**bold**</code> · <code>*italic*</code> · <code>[text](url)</code> · linebreaks ok</span>
      </label>
      <textarea id="caption-input" name="caption" rows="5" placeholder="write something about this entry..."></textarea>
    </div>

    <!-- straight to archive: for backfilling past projects/hikes -->
    <div class="form-row form-row-check">
      <label class="check-label" for="archive-only-input">
        <input id="archive-only-input" type="checkbox" name="archiveOnly">
        straight to archive
        <span class="hint">won't replace the latest on your homepage — for adding past projects/hikes</span>
      </label>
    </div>

    <div class="form-actions">
      <button type="submit" class="publish-btn">publish</button>
      <span class="form-status" id="form-status"></span>
    </div>
  </form>

  <section class="manage-panel" id="manage-panel" hidden>
    <p class="manage-status" id="manage-status">loading your entries…</p>
    <div class="manage-list" id="manage-list"></div>
  </section>

  <script src="../studio-config.js?v=1"></script>
  <script src="../studio-render.js?v=2"></script>
  <script src="studio.js?v=5"></script>
</body>
</html>
