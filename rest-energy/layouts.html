<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>name size · rest energy</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="../style.css?v=111">
<link rel="stylesheet" href="../rest-energy.css?v=22">
<link rel="stylesheet" href="../photozoom.css?v=3">
<style>
  /* this page IS the real gallery — same stylesheet, same script — with a size
     dial on top, so what you're judging is exactly what you'll get. */
  .sz-bar{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;gap:6px;
    justify-content:center;align-items:center;flex-wrap:wrap;padding:10px 12px;
    background:rgba(12,14,10,.97);border-bottom:1px solid rgba(233,218,177,.18)}
  .sz-bar span{font-size:.66rem;letter-spacing:.08em;color:var(--text-muted)}
  .sz-bar button{background:none;border:1px solid rgba(233,218,177,.35);color:var(--text-muted);
    border-radius:999px;padding:6px 14px;font-family:inherit;font-size:.72rem;cursor:pointer}
  .sz-bar button.on{background:var(--text-main);color:#2d3826;border-color:var(--text-main)}
  .sz-back{margin-left:10px;font-size:.7rem;color:var(--text-muted);text-decoration:none;
    border-bottom:1px solid rgba(233,218,177,.3)}
  .sz-note{max-width:560px;margin:0 auto 30px;text-align:center;font-size:.76rem;
    line-height:1.6;color:var(--text-muted);font-style:italic}
  body.rest-energy{padding-top:92px}
  @media(max-width:600px){ body.rest-energy{padding-top:104px} }
</style>
</head>
<body class="rest-energy">
<div class="sz-bar" id="sz-bar">
  <span>name size</span>
  <a class="sz-back" href="./">the real gallery &rarr;</a>
</div>

<header class="re-header">
  <div class="re-title">
    <img class="section-label-img" src="../labels/rest-energy.png?v=2" alt="rest energy">
    <span class="re-subtitle">my visual reflections</span>
  </div>
</header>

<p class="sz-note">
  the collections are collapsed, so it’s just the names — pick a size and tell claude.
  phones get a matching size worked out from whichever you choose.
</p>

<div id="re-collections"></div>

<script src="../studio-config.js?v=1"></script>
<script src="../photozoom.js?v=1"></script>
<script src="../restenergy.js?v=13"></script>
<script>
const SIZES=['1.4','1.6','1.8','1.9','2.1','2.3','2.6','3'];
const bar=document.getElementById('sz-bar'),back=document.querySelector('.sz-back');
function set(v){
  document.documentElement.style.setProperty('--name-size', v+'rem');
  [...bar.querySelectorAll('button')].forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  try{ localStorage.setItem('re-name-size', v); }catch(e){}
}
SIZES.forEach(v=>{const b=document.createElement('button');b.textContent=v+'rem';b.dataset.v=v;
  b.onclick=()=>set(v);bar.insertBefore(b,back);});
let start='1.9';
try{ start=localStorage.getItem('re-name-size')||start; }catch(e){}
set(SIZES.includes(start)?start:'1.9');
</script>
</body>
</html>
